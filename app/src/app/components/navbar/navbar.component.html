<nav>
  <a class="logo" routerLink="/catalogo">
    <svg width="30" height="30" viewBox="0 0 30 30">
      <rect x="9" y="3" width="17" height="23" rx="3" fill="#F2C14E" transform="rotate(12 17 14)" />
      <rect x="4" y="4" width="17" height="23" rx="3" fill="#E3350D" />
      <circle cx="12.5" cy="15.5" r="4" fill="none" stroke="#fff" stroke-width="2" />
    </svg>
    CardVault <b>JP</b>
  </a>

  <ul>
    <li *ngFor="let link of links">
      <a [routerLink]="link.rota" routerLinkActive="on">{{ link.texto }}</a>
    </li>

    <li *ngIf="!auth.estaLogado()">
      <a class="btn" routerLink="/login" routerLinkActive="ativo">Login</a>
    </li>
    <li *ngIf="auth.estaLogado()" class="usuario">
      <span class="tag" [ngClass]="auth.isAdmin() ? 'gold' : 'ok'">{{ auth.usuario?.nome }}</span>
      <button class="btn g sm" (click)="sair()">Sair</button>
    </li>
  </ul>
</nav>
